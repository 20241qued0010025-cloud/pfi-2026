<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço de Mensagens Positivas</title>
    <link rel="stylesheet" href="../css/desabafar.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="../img/loggo.png" alt="Logo do site">
            <p>DesabafaQI</p>
        </div>

        <nav>
            <a href="../pages/painel.html">🏠Voltar</a>
        </nav>
    </header>

    <main class="container">
        <h1>Espaço de Mensagens Positivas</h1>
        <p class="subtext">Compartilhe sua Mensagem Positiva</p>

        <section class="content">
            <div class="form-section">
                <h2>Compartilhe sua mensagem!</h2>

                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Dê um título a sua mensagem">

                <label for="texto">Sua mensagem</label>
                <textarea id="texto" placeholder="Escreva aqui..."></textarea>

                <button type="button" id="enviar">Enviar Mensagem ✔</button>
            </div>

            <div class="desabafos-section">
                <h2>Suas mensagens recentes</h2>
                <div id="listaDesabafos" class="lista"></div>
            </div>
        </section>
    </main>

    <script src="../script/mensagensPositivas.js"></script>

</body>
</html>
