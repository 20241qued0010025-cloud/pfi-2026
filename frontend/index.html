<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidar e Ensinar</title>
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="./img/loggo.png" alt="Logo">
    </div>
    <h2>Bem-vindo de volta!</h2>
    
    <form id="form-login">
      <div class="form-group">
        <label for="username">Usuário:</label>
        <input type="text" id="username" name="username" placeholder="Digite seu usuário">
      </div>

      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha">
      </div>

      <button type="submit" id="btn-login">Entrar</button>
    </form>

    <p class="texto-cadastro">
      Ainda não tem uma conta? <a href="./pages/cadastro.html">Cadastre-se</a>
    </p>
  </div>

  <script src="./script/index.js"></script>
</body>
</html>
